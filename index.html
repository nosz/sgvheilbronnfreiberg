<style>
:root{
  --red:#0a3d73;--red-d:#072c54;--red-l:#e4eef9;--herobg:linear-gradient(135deg,#d8e8f8,#ffffff);
  --bg:#f4f4f4;--card:#ffffff;--ink:#1f2026;--mute:#565860;--line:#e1e2e5;
  --blue:#1565b8;--green:#1b7a3d;--gold:#cfe6fb;--gold-ink:#072c54;--purple:#6b3fa0;
  --ok:#157a3a;--okbg:#e6f6ec;--bad:#b3261e;--badbg:#fdecea;
  --shadow:0 4px 0 rgba(0,0,0,.08),0 8px 22px rgba(0,0,0,.08);
  --r:20px;
  --font:"Trebuchet MS","Segoe UI","Hiragino Maru Gothic ProN","Yu Gothic UI","Meiryo",system-ui,-apple-system,sans-serif;
}
:root[data-theme="dark"]{
  --red:#7dbbf2;--red-d:#0a3d73;--red-l:#10284a;--herobg:linear-gradient(135deg,#0e3668,#13284d);
  --bg:#15161a;--card:#202228;--ink:#f1f2f4;--mute:#b4b6bd;--line:#34363e;
  --blue:#8cc4f5;--green:#5ccf86;--gold:#9cc9f2;--gold-ink:#e0eefb;--purple:#b794f0;
  --ok:#5ccf86;--okbg:#17301f;--bad:#ff8a80;--badbg:#3a1d1b;
  --shadow:0 4px 0 rgba(0,0,0,.35),0 8px 22px rgba(0,0,0,.35);
}
@media(prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --red:#7dbbf2;--red-d:#0a3d73;--red-l:#10284a;--herobg:linear-gradient(135deg,#0e3668,#13284d);
    --bg:#15161a;--card:#202228;--ink:#f1f2f4;--mute:#b4b6bd;--line:#34363e;
    --blue:#8cc4f5;--green:#5ccf86;--gold:#9cc9f2;--gold-ink:#e0eefb;--purple:#b794f0;
    --ok:#5ccf86;--okbg:#17301f;--bad:#ff8a80;--badbg:#3a1d1b;
    --shadow:0 4px 0 rgba(0,0,0,.35),0 8px 22px rgba(0,0,0,.35);
  }
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:1rem/1.6 var(--font);-webkit-text-size-adjust:100%}
a{color:var(--blue)}
button{font:inherit;cursor:pointer}
.skip{position:absolute;left:-999px;top:8px;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;z-index:100}
.skip:focus{left:8px}
:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
/* Kopf */
.top{background:var(--red);color:#fff;position:sticky;top:0;z-index:20;box-shadow:0 3px 0 rgba(0,0,0,.18)}
:root[data-theme="dark"] .top{background:#072c54}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .top{background:#072c54}}
.topin{max-width:1060px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none;font-weight:800;font-size:1.15rem;letter-spacing:.2px;min-height:44px;background:none;border:0;padding:0}
.brand .dot svg{width:24px;height:auto;display:block}.brand .dot{width:34px;height:34px;border-radius:50%;background:#fff;color:var(--red-d);display:grid;place-items:center;font-size:1.2rem;box-shadow:0 2px 0 rgba(0,0,0,.2)}
.brand{text-align:left;line-height:1.2}.brand small{display:block;font-weight:800;font-size:.98rem;opacity:1;letter-spacing:.1px;margin-top:2px;line-height:1.25}
.spacer{flex:1}
.pill{background:rgba(0,0,0,.2);border-radius:999px;padding:6px 12px;font-weight:700;font-size:.9rem;white-space:nowrap}
.lang{display:flex;gap:6px}
.lang button,.theme{min-height:44px;min-width:44px;padding:6px 12px;border-radius:999px;border:2px solid rgba(255,255,255,.7);background:transparent;color:#fff;font-weight:700}
.lang button[aria-pressed="true"]{background:#fff;color:var(--red-d)}
.theme{font-size:1.1rem;padding:0;display:inline-flex;align-items:center;justify-content:center;line-height:1}.theme svg{display:block;flex:none}
/* Layout */
main{max-width:1060px;margin:0 auto;padding:20px 16px 24px;outline:none}
.hero{background:var(--card);border-radius:28px;box-shadow:var(--shadow);padding:22px;display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center;position:relative;overflow:hidden;border:2px solid var(--line)}
.hero::before{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:var(--herobg)}
.hero>*{position:relative}
.hero h1{margin:0 0 6px;font-size:clamp(1.5rem,4.5vw,2.2rem);line-height:1.2}
.hero p{margin:0 0 12px;color:var(--mute)}
.stats{display:flex;gap:10px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--bg);border:2px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:700}
.chip.coin b{color:#072c54;background:var(--gold);border-radius:50%;width:22px;height:22px;display:grid;place-items:center;font-size:.8rem}
.ring{--p:0;width:112px;height:112px;border-radius:50%;background:conic-gradient(var(--red) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center;transition:background .6s}
.ring span{width:84px;height:84px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-weight:800;font-size:1.3rem}
h2.sec{margin:28px 0 12px;font-size:1.3rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.lcard{--c:var(--red);text-align:left;background:var(--card);border:2px solid var(--line);border-top:8px solid var(--c);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);color:var(--ink);display:flex;flex-direction:column;gap:6px;min-height:170px;transition:transform .18s,box-shadow .18s;animation:pop .5s both}
.lcard:hover{transform:translateY(-4px) rotate(-.4deg)}
.lcard:active{transform:translateY(1px)}
.lcard .ico{font-size:2rem;line-height:1}
.lcard h3{margin:0;font-size:1.08rem;line-height:1.3}
.lcard p{margin:0;color:var(--mute);font-size:.92rem}
.lcard .foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;font-size:.9rem;color:var(--mute);font-weight:700}
.stars{letter-spacing:2px;font-size:1.15rem}
.stars .off{opacity:.3;filter:grayscale(1)}
.nr{font-weight:800;color:var(--c)}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:none}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 22px;border-radius:999px;border:0;background:var(--red-d);color:#fff;font-weight:800;box-shadow:0 4px 0 rgba(0,0,0,.25);transition:transform .12s,box-shadow .12s;text-decoration:none}
:root[data-theme="dark"] .btn{background:#1a6fc0}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn{background:#1a6fc0}}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.25)}
.btn.ghost{background:var(--card)!important;color:var(--ink);border:2px solid var(--line);box-shadow:0 3px 0 rgba(0,0,0,.08)}
.crumb{display:flex;gap:12px;flex-wrap:nowrap;align-items:center;margin:0 0 16px;min-width:0}
.ctx{flex:1;min-width:0;color:var(--mute);font-weight:700;font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back{display:inline-flex;align-items:center;gap:4px;flex:none;min-height:44px;padding:8px 16px 8px 8px;border-radius:999px;border:2px solid var(--line);background:var(--card);color:var(--ink);font-weight:800;box-shadow:0 3px 0 rgba(0,0,0,.08);transition:transform .12s}
.back svg{color:var(--red);flex:none}
.back:hover{transform:translateX(-2px)}.back:active{transform:translateY(2px);box-shadow:none}
/* Lektion */
.lhead{display:flex;gap:14px;align-items:center;margin-bottom:14px}
.lhead .big{font-size:3rem;animation:wob 2.4s ease-in-out infinite}
@keyframes wob{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg) translateY(-4px)}}
.lhead h1{margin:0;font-size:clamp(1.4rem,4.5vw,2rem);line-height:1.25}
.lhead p{margin:0;color:var(--mute)}
.card{background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:16px 18px;margin:0 0 14px;box-shadow:var(--shadow);animation:pop .5s both}
.card h2{margin:0 0 6px;font-size:1.1rem}
.card p{margin:0}
.card .n{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--red-d);color:#fff;font-weight:800;margin-right:8px;font-size:.9rem}
.bubble{background:var(--gold);color:#072c54;border-radius:22px;padding:14px 18px;margin:18px 0 22px;font-weight:700;box-shadow:0 3px 10px rgba(0,0,0,.14);animation:pop .5s .25s both}
:root[data-theme="dark"] .bubble{color:#072c54}
.bubble small{display:block;font-weight:800;letter-spacing:.5px;text-transform:uppercase;font-size:.75rem;margin-bottom:2px}
details.pro{background:var(--card);border:2px dashed var(--c,var(--red));border-radius:var(--r);padding:0;margin:0 0 14px}
details.pro summary{min-height:48px;padding:12px 18px;font-weight:800;cursor:pointer;list-style:none;display:flex;gap:8px;align-items:center}
details.pro summary::-webkit-details-marker{display:none}
details.pro summary::before{content:"\1F3C6";font-size:1.2rem}
details.pro[open] summary::before{content:"\2B50"}
details.pro p{margin:0;padding:0 18px 16px}
.src{font-size:.9rem;color:var(--mute);margin:16px 0}
.src ul{margin:6px 0 0;padding-left:20px}
.src li{margin:4px 0}
.sticky{position:sticky;bottom:0;display:flex;justify-content:center;margin:28px -16px 0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:var(--bg);border-top:1px solid var(--line);box-shadow:0 -8px 18px rgba(0,0,0,.07);z-index:10}.next{margin:16px 0 0}.next .btn{width:100%;min-height:52px;font-size:1.05rem}.sticky .btn{width:100%;max-width:420px;min-height:52px;font-size:1.05rem}
/* Quiz */
.dots{display:flex;gap:6px;margin:0 0 16px}
.dots i{flex:1;height:10px;border-radius:99px;background:var(--line);transition:background .3s}
.dots i.on{background:var(--ok)}
.dots i.no{background:var(--bad)}
.dots i.cur{background:var(--blue)}

    await gehe(g, x1, H - 30, .1);

    await gehe(g, x2, H - 86, .1);

  /* Auftritt 22: Mini-Modus, dann Mega-Modus */
  async function groesse(d){
    const dir = rd(), b = bahn(d, pick(["boden","mitte"]), dir), g = neu({x: rein(dir, d), y: b.y, r: 0, f: b.f});
    await gehe(g, anteil(dir, d, .25)); sag(g, GROESSE[0], 1400); await skaliere(g, .4, 500);
    await gehe(g, anteil(dir, d, .5), undefined, .35);
    sag(g, GROESSE[1], 1600); await skaliere(g, 2.4, 900);
    await gehe(g, anteil(dir, d, .8), undefined, .25);
    await skaliere(g, 1, 500); await gehe(g, raus(dir, d), undefined, .3);
  }
  /* Auftritt 23: schleicht sich an, klaut die Meisterschale und rennt damit davon */
  async function dieb(d){
    const dir = rd(), b = bahn(d, "boden", dir), g = neu({x: rein(dir, d), y: b.y, r: 0, f: b.f}), x = anteil(dir, d, rnd(.4, .65)), boden = b.y + 24;

    tr.style.left = (x - 13) + "px"; tr.style.top = (boden - 28) + "px"; document.body.appendChild(tr); aktiv.push(tr);
    await gehe(g, x - dir * 130, undefined, .2);

    await gehe(g, x - dir * 40, undefined, .06);

  /* Auftritt 24: erzählt einen Witz über einen anderen Verein (Frage, Pause, Pointe) und freut sich selbst darüber */
  async function witz(d){
    const dir = rd(), b = bahn(d, pick(["boden","boden","mitte"]), dir), g = neu({x: rein(dir, d), y: b.y, r: 0, f: b.f}), w = pick(WITZE);

    sag(g, w[1], 3600, true); await sprung(g, 30); await stehen(g, 700); drehen(g); await sprung(g, 22); await stehen(g, 2600);

  /* Auftritt 25: fragt nach dem Namen und zeigt auf das Eingabefeld (nur auf der Startseite, höchstens dreimal insgesamt) */
  function nameNudge(){
    const el = document.querySelector(".nameq") || document.querySelector(".herobar .namebtn"); if(!el) return;
    /* Die Seite scrollt NIE von selbst (Nutzer lesen weiter unten, ein automatischer Sprung nach oben verwirrt): das Feld pulsiert nur, wenn es gerade im sichtbaren Bereich liegt */
    const r = el.getBoundingClientRect(); if(r.bottom < 0 || r.top > innerHeight) return;

  }
  /* Zielpunkt der Figur: oberer Rand des Namensfelds (oder des Knopfs "Name eintragen"); holt das Feld dafür sofort in den sichtbaren Bereich */
  const zielVon = el => { const d = dim(), r = el.getBoundingClientRect(); return {el, x: Math.min(d.W - 26, Math.max(26, r.right - 34)), y: Math.max(d.hb + 28, Math.min(d.H - 40, r.top - 20))}; };
  async function namensZiel(){
    const el = document.querySelector(".nameq") || document.querySelector(".herobar .namebtn"); if(!el) return null;
    const r0 = el.getBoundingClientRect(), d = dim(); if(r0.bottom < d.hb || r0.top > d.H) return null;   /* Die Seite scrollt NIE von selbst: liegt das Feld ausserhalb des sichtbaren Bereichs, geht die Figur nicht zum Feld */
    return zielVon(el);
  }
  /* Steht das Feld nach Layout-Änderungen woanders, geht die Figur zur neuen Stelle */
  async function anZiel(g, z){ if(!z) return; const n = zielVon(z.el); if(Math.abs(n.y - g.s.y) > 3 || Math.abs(n.x - g.s.x) > 3) await gehe(g, n.x, n.y, .35); }
  async function namensfrage(d){
    if(typeof hasName === "function" && hasName()) return;
    ach.nq = (ach.nq || 0) + 1; save(); stopBeiName = true;
    const q = NAMEQ[Math.min(ach.nq - 1, NAMEQ.length - 1)], z = await namensZiel();
    /* Die Figur läuft direkt an das Namensfeld und steht auf dessen oberer Kante (fehlt das Feld, geht sie ein Stück in den Bildschirm) */
    const dir = z ? (z.x > d.W / 2 ? -1 : 1) : rd(), b = bahn(d, pick(["boden","mitte"]), dir), g = neu({x: rein(dir, d), y: z ? z.y : b.y, r: 0, f: z ? dir : b.f});
    await gehe(g, z ? z.x : anteil(dir, d, rnd(.3, .55)), z ? z.y : undefined, .4);
    if(z) setze(g, {f: z.x > d.W / 2 ? -1 : 1});
    const geht = () => { if(hatName()) throw new Error("stop"); };   // Name ist da: sofort aufhören, gleich kommt das Lob
    await anZiel(g, z); geht(); await stehen(g, 200); geht(); sag(g, q[0], 3600, true); await sprung(g, 28); await stehen(g, 3600); geht();
    await anZiel(g, z); geht(); nameNudge(); sag(g, q[1], 4000, true); await sprung(g, 24); await stehen(g, 2000); geht(); drehen(g); await stehen(g, 600); drehen(g); await sprung(g, 20); await stehen(g, 1800);
    await gehe(g, raus(dir, d), undefined, .3);
  }
  /* Auftritt 27: kommt sofort wieder, wenn gerade ein Name eingetragen wurde, und lobt auf lustige Art (mit Konfetti) */
  async function lob(d){
    const dir = rd(), b = bahn(d, pick(["boden","mitte"]), dir), g = neu({x: rein(dir, d), y: b.y, r: 0, f: b.f}), l = pick(LOB);
    await gehe(g, anteil(dir, d, rnd(.3, .55)), undefined, .5);
    await stehen(g, 150); try{ if(typeof confetti === "function") confetti(); }catch(e){}
    sag(g, l[0], 3200, true); await sprung(g, 34); await stehen(g, 3200);
    sag(g, l[1], 3400, true); await salto(g); await stehen(g, 2800);
    sag(g, l[2], 3000, true); await sprung(g, 26); await stehen(g, 2800);

  /* Auftritt 26: begrüßt eine Person mit eingetragenem Namen gleich nach dem Start: kurzer Witz, dann "I komm wieda, <Name>!" (einmal je Sitzung) */
  async function begruessung(d){
    try{ sessionStorage.setItem("sgvhf-gruss", "1"); }catch(e){}
    const dir = rd(), b = bahn(d, pick(["boden","mitte"]), dir), g = neu({x: rein(dir, d), y: b.y, r: 0, f: b.f}), w = pick(KURZWITZE);
    await gehe(g, anteil(dir, d, rnd(.3, .55)), undefined, .4);
    await stehen(g, 200); sag(g, pick(GRUSS), 2400, true); await sprung(g, 26); await stehen(g, 2400);
    sag(g, w, 4400, true); await stehen(g, 4400); await sprung(g, 22); await stehen(g, 300);
    sag(g, pick(TSCHUESS), 2800, true); await sprung(g, 30); await stehen(g, 1200); drehen(g); await stehen(g, 300); drehen(g); await stehen(g, 1000);
    await gehe(g, raus(dir, d), undefined, .35);
  }  /* Auftritt: rollt als Ball mit vollen Umdrehungen ueber den Bildschirm, haelt an und huepft */
  async function rollen(d){
    const dir = rd(), b = bahn(d, pick(["boden","boden","mitte"]), dir), g = neu({x: rein(dir, d), y: b.y, r: 0, f: b.f});
    const x0 = g.s.x, y0 = g.s.y, x1 = anteil(dir, d, rnd(.55, .8)), n = Math.max(2, Math.round(Math.abs(x1 - x0) / 140)), kf = [];
    for(let i = 0; i <= 24; i++){ const u = i / 24; kf.push({transform: T({x: x0 + (x1 - x0) * u, y: y0, r: 360 * n * dir * u, f: g.s.f})}); }
    sag(g, ROLL[0], 1800);
    await anim(g, kf, Math.max(900, Math.abs(x1 - x0) / .22), {x: x1, y: y0, r: 0, f: g.s.f, z: g.s.z});
    await stehen(g, 300); sag(g, ROLL[1], 1500); await sprung(g, 40); await stehen(g, 500);
    await gehe(g, raus(dir, d), undefined, .3);
  }
  const MUSTER = {quer: [quer, 4], umkehr: [umkehr, 4], wand: [wand, 3], rundherum: [rundherum, 2], gucken: [gucken, 4], huepfer: [huepfer, 3], stolpern: [stolpern, 3], schlafen: [schlafen, 2], moonwalk: [moonwalk, 2], turbo: [turbo, 2], schleichen: [schleichen, 2], kneipe: [kneipe, 2], wurst: [wurst, 2], rollen: [rollen, 3], pokaljagd: [pokaljagd, 2], helmziehen: [helmziehen, 2], tor: [tor, 2], hallo: [hallo, 1], karriere: [karriere, 2], stern: [stern, 2], ballon: [ballon, 2], fass: [fass, 2], groesse: [groesse, 2], dieb: [dieb, 2], witz: [witz, 5]};
  const SPEZIAL = {name: namensfrage, gruss: begruessung, lob: lob};
  function waehle(name){
    if(name && SPEZIAL[name]) return SPEZIAL[name];
    if(name && MUSTER[name]) return MUSTER[name][0];

  }
  let laeuft = false, lobOffen = false;
  async function auftritt(name){

  const brauchtName = () => view && view.v === "home" && typeof hasName === "function" && !hasName() && (ach.nq || 0) < 6;
  const hatName = () => typeof hasName === "function" && hasName();

  (async function(){
    /* Wird zum ersten Mal ein Name eingetragen (auf Startseite oder in einer Lektion), kommt der kleine Fußball gleich zum Loben */
    let hatteName = hatName();
    setInterval(() => { const jetzt = hatName(); if(jetzt && !hatteName && view && (view.v === "home" || view.v === "lesson")) lobOffen = true; hatteName = jetzt; if(li !== lastLi){ lastLi = li; sprachNeu = true; } }, 300);
    await warte(test !== undefined ? 1200 : (brauchtName() ? 1200 : (hatName() ? 2000 : rnd(8000, 20000))));
    let erster = test === undefined, zurueck = false; for(;;){
      if(ach.noDino){ lobOffen = false; sprachNeu = false; zurueck = true; await wait(1000); continue; }
      let n = test || undefined;
      if(zurueck){ zurueck = false; await wait(800); n = "hallo"; }
      if(lobOffen){ lobOffen = false; n = "lob"; await wait(700); }
      else if(sprachNeu){ sprachNeu = false; n = "hallo"; await wait(500); }
      else if(!n && brauchtName() && (erster || R() < .7)) n = "name"; else if(!n && erster && hatName() && grussFaellig()) n = "gruss"; else if(!n && erster && R() < .5) n = "hallo";
      await auftritt(n); erster = false; await warte(test !== undefined ? 1500 : (brauchtName() ? rnd(15000, 30000) : (R() < .15 ? rnd(4000, 9000) : rnd(25000, 80000))));
    }
  })();
})();
/* Feste Orientierungsleiste: Hoehen messen, Schatten nur wenn festgeheftet */
function syncHH(){
  const r = document.documentElement.style, e = document.querySelector(".top"), n = document.querySelector(".stickynav");
  if(e) r.setProperty("--hh", e.getBoundingClientRect().height + "px");
  r.setProperty("--nh", n ? n.getBoundingClientRect().height + "px" : "0px");
  stuckPruefen();
}
function stuckPruefen(){
  const n = document.querySelector(".stickynav"); if(!n) return;
  const top = parseFloat(getComputedStyle(n).top) || 0;
  n.classList.toggle("stuck", scrollY > 2 && n.getBoundingClientRect().top <= top + 1);
}
addEventListener("resize", syncHH);
let stuckBusy = false;
addEventListener("scroll", () => { if(stuckBusy) return; stuckBusy = true; requestAnimationFrame(() => { stuckBusy = false; stuckPruefen(); }); }, {passive:true});
{ const _render = render; render = function(...a){ const r = _render.apply(this, a); syncHH(); return r; }; }
syncHH();
